          <div class="nav-list">

            <a class="nav-item" data-view="audit" href="/audit.html"><i data-lucide="scan-search"></i><span>数据审计</span></a>

        <div class="nav-group">

          <div class="nav-list">

      <div class="sidebar-status"><span class="status-dot"></span><span id="sidebarStatus">读取本地真实数据</span></div>

    <main class="main control-main">

        <div class="header-actions">

          <button class="refresh-button" id="refreshBtn" type="button"><i data-lucide="refresh-cw"></i><span>刷新</span></button>

      <section id="controlContent" aria-live="polite"><div class="panel-empty">正在读取真实数据</div></section>
